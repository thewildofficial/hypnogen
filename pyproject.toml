[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hypnogen*"]
exclude = ["cosyvoice*", "dia*", "f5-tts*", "fish-speech*", "melotts*", "orpheus*", "parler-tts*", "piper*", "spark-tts*", "zonos*", "tests*"]

[project]
name = "hypnogen"
version = "0.1.0"
description = "Audio frequency generator for hypnosis and brainwave entrainment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Aban Hasan"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.8,<9",
    "fastapi>=0.115.0,<1",
    "gradio>=6.5.1,<7",
    "httpx>=0.28.1,<0.29",
    "kokoro>=0.9.4,<1",
    "librosa>=0.11.0,<0.12",
    "misaki>=0.9.4,<1",
    "numpy>=2.3.5,<3",
    "pedalboard>=0.9.22,<0.10",
    "pydantic>=2.12.5,<3",
    "python-dotenv>=1.2.1,<2",
    "scipy>=1.17.0,<2",
    "soundfile>=0.13.1,<1",
    "torch>=2.10.0,<3",
    "uvicorn>=0.40.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
]
coreml = [
    "coremltools>=9.0,<10",
    "huggingface-hub>=1.4.1,<2",
]

[project.scripts]
hypnogen = "hypnogen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["hypnogen"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
