[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hypnogen*"]
exclude = ["cosyvoice*", "dia*", "f5-tts*", "fish-speech*", "melotts*", "orpheus*", "parler-tts*", "piper*", "spark-tts*", "zonos*", "tests*"]

[project]
name = "hypnogen"
version = "0.1.0"
description = "Audio frequency generator for hypnosis and brainwave entrainment"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "HypnoGen Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.8",
    "fastapi>=0.115.0",
    "gradio>=4.44.1",
    "httpx>=0.28.1",
    "kokoro>=0.2.2",
    "librosa>=0.11.0",
    "numpy>=2.0.2",
    "pedalboard>=0.9.19",
    "pydantic>=2.0",
    "python-dotenv>=1.2.1",
    "scipy>=1.13.1",
    "soundfile>=0.13.1",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
coreml = [
    "coremltools>=8.1.0",
    "huggingface-hub>=0.20.0",
    "pip>=24.0",
]

[project.scripts]
hypnogen = "hypnogen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["hypnogen"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
